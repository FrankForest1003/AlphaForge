[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Auditable multi-agent strategy optimisation pipeline for QuantConnect LEAN"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109,<3",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alphaforge.agents" = [
  "context_assets/*.md",
  "context_assets/references/*.md",
  "context_assets/templates/*.tpl",
  "context_assets/prompts/en/*.md",
  "context_assets/prompts/zh-CN/*.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
