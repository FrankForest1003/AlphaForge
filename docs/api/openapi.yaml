openapi: 3.1.0
info:
  title: AlphaForge API
  version: 1.0.0
  description: Auditable strategy optimisation and normalized backtest contracts.
servers:
  - url: /v1
paths:
  /optimisations:
    post:
      operationId: createOptimisation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/OptimizationRequest.schema.json
      responses:
        "202":
          description: Optimisation job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimisationAccepted"
        "409":
          $ref: "#/components/responses/ContractError"
        "422":
          $ref: "#/components/responses/ContractError"
  /optimisations/{optimization_id}:
    get:
      operationId: getOptimisation
      parameters:
        - name: optimization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job state or completed result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OptimisationStatus"
                  - $ref: ./schemas/OptimizationResult.schema.json
        "404":
          $ref: "#/components/responses/ContractError"
  /backtests:
    post:
      operationId: createBacktest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/BacktestSubmission.schema.json
      responses:
        "202":
          description: Backtest job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestAccepted"
        "409":
          $ref: "#/components/responses/ContractError"
        "422":
          $ref: "#/components/responses/ContractError"
  /backtests/{run_id}:
    get:
      operationId: getBacktest
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current backtest state or normalized completed result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BacktestStatus"
                  - $ref: ./schemas/BacktestResult.schema.json
        "404":
          $ref: "#/components/responses/ContractError"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    OptimisationAccepted:
      type: object
      additionalProperties: false
      required: [optimization_id, status, status_url]
      properties:
        optimization_id:
          type: string
        status:
          const: queued
        status_url:
          type: string
    OptimisationStatus:
      type: object
      additionalProperties: false
      required: [optimization_id, status]
      properties:
        optimization_id:
          type: string
        status:
          enum:
            - queued
            - summarizing_evidence
            - designing
            - validating_spec
            - generating_code
            - validating_code
            - reviewing_code_risk
            - repairing
            - smoke_testing
            - backtesting
            - post_backtest_analysis
            - selecting
        current_route:
          enum: [traditional, ml, hybrid]
    BacktestAccepted:
      type: object
      additionalProperties: false
      required: [run_id, status, status_url]
      properties:
        run_id:
          type: string
        status:
          const: queued
        status_url:
          type: string
    BacktestStatus:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          enum: [queued, running]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
  responses:
    ContractError:
      description: Contract, idempotency, or policy error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
